[project]
name = "board-vision"
version = "0.1.0"
description = "«Видение доски» — тренажёр: после хода соперника увидеть всё, что теперь под ударом"
requires-python = ">=3.14"
dependencies = [
    "chess>=1.11.2",
    "claude-agent-sdk>=0.2.187",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.50"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# the window's tests are slow (a server and Chrome): `uv run pytest -m browser` before merging a change of the window
addopts = "-m 'not browser'"
markers = [
    "engine: needs Stockfish (skipped without it)",
    "browser: drives the window in Chrome against a test server (run with -m browser)",
]
