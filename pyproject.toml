[project]
name = "board-vision"
version = "0.1.0"
description = "«Видение доски» — тренажёр: после хода соперника увидеть всё, что теперь под ударом"
requires-python = ">=3.14"
dependencies = [
    "chess>=1.11.2",
    "claude-agent-sdk>=0.2.187",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
