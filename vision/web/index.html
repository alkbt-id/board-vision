<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- iPad: the page runs under the status bar and pads its header by the safe area, as in «Шахматный тренер» -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/static/favicon.png">
<title>Видение доски</title>
<link rel="stylesheet" href="/static/vendor/chessground.base.css">
<link rel="stylesheet" href="/static/vendor/board.lichess-brown.css">
<link rel="stylesheet" href="/static/vendor/pieces.merida.css">
<!-- ?v=: the iPad keeps static files cached; bump it (here and on app.js below) when app.css or app.js changes -->
<link rel="stylesheet" href="/static/app.css?v=27">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-left">
      <button class="ibtn" id="exit" hidden aria-label="На главный экран" title="На главный экран (Esc дважды)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="title" title="На главный экран">Видение доски</div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </header>
  <main class="layout" id="layout">
    <section class="board-col">
      <!-- the strip over the board: the series, what to do now (or how it went), and the one button -->
      <div class="board-mode" id="board-mode">
        <div class="bm-dots" id="bm-dots" role="img"></div>
        <div class="bm-text" id="bm-text" aria-live="polite"></div>
        <button class="bm-undo" id="bm-undo" hidden aria-label="Убрать последнюю стрелку" title="Убрать последнюю стрелку (Backspace)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="bm-btn" id="bm-btn" hidden></button>
      </div>
      <!-- the board in a wooden frame with the coordinates on all four sides, as on a real board -->
      <div class="board-wrap" id="board-wrap">
        <div class="fc fc-n" id="fc-top" aria-hidden="true"></div>
        <div class="fc fc-s" id="fc-bottom" aria-hidden="true"></div>
        <div class="fc fc-w" id="fc-left" aria-hidden="true"></div>
        <div class="fc fc-e" id="fc-right" aria-hidden="true"></div>
        <div id="board"></div>
      </div>
    </section>
    <!-- while you play: the moves of the game fragment, as on Lichess -->
    <aside class="moves" id="moves" hidden aria-label="Ходы">
      <div class="moves-list" id="moves-list"></div>
    </aside>
    <aside class="side">
      <div class="side-body" id="panel"></div>
    </aside>
  </main>
</div>
<script type="module" src="/static/app.js?v=37"></script>
</body>
</html>
